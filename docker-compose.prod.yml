services:
  web:
    build: .
    container_name: beraum-web
    restart: unless-stopped
    env_file: .env.production
    depends_on:
      db:
        condition: service_healthy
      storage:
        condition: service_healthy

  proxy:
    image: caddy:2-alpine
    container_name: beraum-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - beraum_caddy_data:/data
      - beraum_caddy_config:/config
    depends_on:
      - web

  db:
    image: postgres:16-alpine
    container_name: beraum-db
    restart: unless-stopped
    env_file: .env.production
    volumes:
      - beraum_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  storage:
    image: minio/minio:latest
    container_name: beraum-storage
    restart: unless-stopped
    env_file: .env.production
    volumes:
      - beraum_miniodata:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  beraum_pgdata:
    driver: local
  beraum_miniodata:
    driver: local
  beraum_caddy_data:
    driver: local
  beraum_caddy_config:
    driver: local
