services:
  web:
    build: .
    container_name: beraum-web
    restart: unless-stopped
    env_file: .env.production
    depends_on:
      db:
        condition: service_healthy
      storage:
        condition: service_healthy

  proxy:
    image: caddy:2-alpine
    container_name: beraum-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - beraum_caddy_data:/data
      - beraum_caddy_config:/config
    depends_on:
      - web
    networks:
      default:
        aliases:
          - beraum.com
          - www.beraum.com
          - s3.beraum.com
          - admin-s3.beraum.com

  db:
    image: postgres:16-alpine
    container_name: beraum-db
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    env_file: .env.production
    volumes:
      - beraum_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  storage:
    image: minio/minio:latest
    container_name: beraum-storage
    restart: unless-stopped
    env_file: .env.production
    volumes:
      - beraum_miniodata:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  storage-init:
    image: minio/mc:latest
    container_name: beraum-storage-init
    depends_on:
      storage:
        condition: service_healthy
    env_file: .env.production
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://storage:9000 $$MINIO_ACCESS_KEY $$MINIO_SECRET_KEY;
      /usr/bin/mc mb --ignore-existing myminio/products;
      /usr/bin/mc anonymous set download myminio/products;
      /usr/bin/mc mb --ignore-existing myminio/system-assets;
      /usr/bin/mc anonymous set download myminio/system-assets;
      /usr/bin/mc mb --ignore-existing myminio/support-media;
      /usr/bin/mc ilm rule add myminio/support-media --expire-days 30 || true;
      exit 0;
      "

volumes:
  beraum_pgdata:
    driver: local
  beraum_miniodata:
    driver: local
  beraum_caddy_data:
    driver: local
  beraum_caddy_config:
    driver: local
